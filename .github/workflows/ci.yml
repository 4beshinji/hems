name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: services/brain/src:services/backend

jobs:
  # ── Python linting ─���───────────────────────────────────────────────
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ── Backend tests with coverage ────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/brain/requirements.txt
            services/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r services/brain/requirements.txt
          pip install -r services/backend/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: >
          pytest tests/ services/brain/tests/
          -v --tb=short
          -m "not integration and not e2e and not benchmark"
          --cov --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ── Frontend lint + type check + build ─────────────────────────────
  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Type check and build
        run: pnpm build

  # ── Docker build validation ────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { context: "services/brain",            name: "brain",            needs_base: true }
          - { context: "services/backend",          name: "backend",          needs_base: true }
          - { context: "services/frontend",         name: "frontend",         needs_base: false }
          - { context: "services/voice",            name: "voice",            needs_base: true }
          - { context: "services/gas-bridge",       name: "gas-bridge",       needs_base: true }
          - { context: "services/ha-bridge",        name: "ha-bridge",        needs_base: true }
          - { context: "services/biometric-bridge", name: "biometric-bridge", needs_base: true }
          - { context: "services/obsidian-bridge",  name: "obsidian-bridge",  needs_base: true }
          - { context: "services/news-bridge",      name: "news-bridge",      needs_base: true }
          - { context: "services/weather-bridge",   name: "weather-bridge",   needs_base: true }
          - { context: "services/switchbot-bridge",  name: "switchbot-bridge", needs_base: true }
          - { context: "services/tapo-bridge",      name: "tapo-bridge",      needs_base: true }
          - { context: "services/knowledge-bridge", name: "knowledge-bridge", needs_base: true }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Python services FROM hems-base:py3.11 — build it locally first so the
      # subsequent service build can resolve the FROM. Cached via gha across runs.
      - name: Build hems-base
        if: matrix.service.needs_base
        uses: docker/build-push-action@v6
        with:
          context: infra/base
          tags: hems-base:py3.11
          push: false
          load: true
          cache-from: type=gha,scope=hems-base
          cache-to: type=gha,mode=max,scope=hems-base

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          load: false
          cache-from: |
            type=gha,scope=${{ matrix.service.name }}
            type=gha,scope=hems-base
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ── Security scanning ──────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit brain dependencies
        run: pip-audit -r services/brain/requirements.txt
      - name: Audit backend dependencies
        run: pip-audit -r services/backend/requirements.txt
      - name: Install hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
      - name: Lint Dockerfiles
        run: |
          find services -name "Dockerfile" -type f | while read -r df; do
            echo "::group::hadolint $df"
            hadolint "$df" || true
            echo "::endgroup::"
          done
