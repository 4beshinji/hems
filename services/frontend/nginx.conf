server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Content-Security-Policy
    #
    # Rationale per directive:
    #   default-src 'self'        — safe baseline; explicit overrides below
    #   script-src  'self'        — Vite build emits /assets/*.js only; no inline scripts in dist/index.html
    #                               'wasm-unsafe-eval' required by onnxruntime-web (used by @ricky0123/vad-web)
    #                               blob: required for AudioWorklet module URL created internally by vad-web/MicVAD
    #   style-src   'self'        — Tailwind 4 + Vite emit a single /assets/*.css bundle; no runtime inline styles
    #   img-src     'self' data:  — QRCode.toDataURL() in mobile/page.tsx produces data:image/png;base64 for <img src>
    #   media-src   'self'        — Audio playback uses new Audio(url) with /audio/ same-origin proxy URLs only
    #   connect-src 'self'        — all fetch() calls use relative /api/ paths (nginx proxy); no external endpoints
    #   font-src    'self'        — Inter loaded from /assets/ bundle (no Google Fonts CDN)
    #   worker-src  blob: 'self'  — AudioWorklet addModule uses a blob: URL (vad-web internals); onnxruntime may spawn workers
    #   object-src  'none'        — no plugins (Flash etc.)
    #   base-uri    'self'        — prevent base tag injection
    #   frame-ancestors 'self'    — consistent with X-Frame-Options SAMEORIGIN above
    #
    # tighten 候補 (現状は動作優先で緩め):
    #   worker-src blob: — vad-web の内部実装が blob: worklet を使わないことが確認できれば 'self' のみに絞れる
    #   script-src blob: — 同上、AudioWorklet が self: で解決できれば削除可能
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; font-src 'self'; worker-src blob: 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # API proxy — use variables for lazy DNS resolution so nginx starts
    # even if upstream containers are not yet running.
    # Biometric webhook — receives data from Gadgetbridge app on phone
    location /api/biometric/ {
        resolver 127.0.0.11 valid=30s;
        set $biometric_upstream http://biometric-bridge:8000;
        rewrite ^/api/biometric/(.*) /api/biometric/$1 break;
        proxy_pass $biometric_upstream;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    location /api/stt/ {
        resolver 127.0.0.11 valid=30s;
        set $stt_upstream http://stt-service:8000;
        rewrite ^/api/stt/(.*) /api/stt/$1 break;
        proxy_pass $stt_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${HEMS_INTERNAL_TOKEN}";
        client_max_body_size 10m;
    }

    location /api/voice/ {
        resolver 127.0.0.11 valid=30s;
        set $voice_upstream http://voice-service:8000;
        rewrite ^/api/voice/(.*) /api/voice/$1 break;
        proxy_pass $voice_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${HEMS_INTERNAL_TOKEN}";
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        # Shared-key gate for the dashboard routers (backend auth.verify_api_key).
        # Empty Bearer is harmless when BACKEND_API_KEY is unset (backend runs open).
        proxy_set_header Authorization "Bearer ${BACKEND_API_KEY}";
        proxy_read_timeout 180;
    }

    location /audio/ {
        resolver 127.0.0.11 valid=30s;
        set $voice_audio_upstream http://voice-service:8000;
        rewrite ^/audio/(.*) /audio/$1 break;
        proxy_pass $voice_audio_upstream;
        proxy_set_header Host $host;
    }

    # Zigbee2MQTT admin UI — same-origin proxy with WebSocket upgrade.
    # No auth required (LAN-trusted). If Z2M serves absolute asset paths that
    # break under /z2m/, fall back to direct port http://<host>:${HEMS_PORT_Z2M_UI:-8090}/.
    location /z2m/ {
        resolver 127.0.0.11 valid=30s;
        set $z2m_upstream http://zigbee2mqtt:8080;
        rewrite ^/z2m/?(.*)$ /$1 break;
        proxy_pass $z2m_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
