server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # API proxy — use variables for lazy DNS resolution so nginx starts
    # even if upstream containers are not yet running.
    # Biometric webhook — receives data from Gadgetbridge app on phone
    location /api/biometric/ {
        resolver 127.0.0.11 valid=30s;
        set $biometric_upstream http://biometric-bridge:8000;
        rewrite ^/api/biometric/(.*) /api/biometric/$1 break;
        proxy_pass $biometric_upstream;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    location /api/stt/ {
        resolver 127.0.0.11 valid=30s;
        set $stt_upstream http://stt-service:8000;
        rewrite ^/api/stt/(.*) /api/stt/$1 break;
        proxy_pass $stt_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${HEMS_INTERNAL_TOKEN}";
        client_max_body_size 10m;
    }

    location /api/voice/ {
        resolver 127.0.0.11 valid=30s;
        set $voice_upstream http://voice-service:8000;
        rewrite ^/api/voice/(.*) /api/voice/$1 break;
        proxy_pass $voice_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${HEMS_INTERNAL_TOKEN}";
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        # Shared-key gate for the dashboard routers (backend auth.verify_api_key).
        # Empty Bearer is harmless when BACKEND_API_KEY is unset (backend runs open).
        proxy_set_header Authorization "Bearer ${BACKEND_API_KEY}";
        proxy_read_timeout 180;
    }

    location /audio/ {
        resolver 127.0.0.11 valid=30s;
        set $voice_audio_upstream http://voice-service:8000;
        rewrite ^/audio/(.*) /audio/$1 break;
        proxy_pass $voice_audio_upstream;
        proxy_set_header Host $host;
    }

    # Zigbee2MQTT admin UI — same-origin proxy with WebSocket upgrade.
    # No auth required (LAN-trusted). If Z2M serves absolute asset paths that
    # break under /z2m/, fall back to direct port http://<host>:${HEMS_PORT_Z2M_UI:-8090}/.
    location /z2m/ {
        resolver 127.0.0.11 valid=30s;
        set $z2m_upstream http://zigbee2mqtt:8080;
        rewrite ^/z2m/?(.*)$ /$1 break;
        proxy_pass $z2m_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
