name: hems

# =============================================================================
# YAML Anchors — W4.2
# =============================================================================

# --- Healthcheck anchors ---

# HTTP /health endpoint (urllib — no curl dep). Used by Python bridges & services.
x-healthcheck-http-health: &healthcheck-http-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

# HTTP /docs endpoint (urllib). Used by backend, voice-service, mock-llm.
x-healthcheck-http-docs: &healthcheck-http-docs
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

# MQTT socket reachability (brain → mosquitto). Used by brain.
x-healthcheck-socket-mqtt: &healthcheck-socket-mqtt
  test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('mosquitto',1883),5); s.close()"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

# --- Resource limit anchors ---
# 実測後に調整すること。OOM kill を避けるため初期値は緩め設定。
# docker stats で 24h ピーク使用量を確認し適宜絞る。

# Brain (LLM + rule dual-mode + world model): 2 GB
x-limits-brain: &limits-brain
  deploy:
    resources:
      limits:
        memory: 2G
      reservations:
        memory: 256M

# Ollama (Local LLM inference): 8 GB (モデルサイズに応じて要調整)
x-limits-ollama: &limits-ollama
  deploy:
    resources:
      limits:
        memory: 8G
      reservations:
        memory: 512M

# Perception (YOLOv11s-pose + VLM): 4 GB
x-limits-perception: &limits-perception
  deploy:
    resources:
      limits:
        memory: 4G
      reservations:
        memory: 512M

# STT (Whisper large-v3-turbo): 3 GB
x-limits-stt: &limits-stt
  deploy:
    resources:
      limits:
        memory: 3G
      reservations:
        memory: 256M

# Lightweight Python bridges: 512 MB
x-limits-bridge: &limits-bridge
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 64M

# Backend (FastAPI + SQLAlchemy + MQTT): 512 MB
x-limits-backend: &limits-backend
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 64M

services:
  # --- Shared Python base image (bootstrap) ---
  # Build first via:  docker compose --profile bootstrap build base
  # (or: make docker-base)
  # Every Python service Dockerfile FROMs hems-base:py3.11.
  base:
    image: hems-base:py3.11
    build:
      context: ..
      dockerfile: infra/base/Dockerfile
    profiles: ["bootstrap"]
    command: ["true"]
    restart: "no"

  # --- Central Bus ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hems-mqtt
    restart: always
    ports:
      - "${MQTT_BIND_ADDR:-127.0.0.1}:${HEMS_PORT_MQTT:-1893}:1883"
    environment:
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.txt:/mosquitto/config/acl.txt:ro
      - ./mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - hems_mqtt_data:/mosquitto/data
      - hems_mqtt_log:/mosquitto/log
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    networks:
      - hems-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -u hems-health -P \"$$MQTT_PASS\" -t hems/healthcheck -m ok -q 0 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # --- Brain (LLM + Rule-based dual mode) ---
  brain:
    build: ../services/brain
    container_name: hems-brain
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-brain
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_API_URL=${LLM_API_URL:-http://ollama:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-oss:20b}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BACKEND_URL=http://backend:8000
      - VOICE_SERVICE_URL=http://voice-service:8000
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://hems:${POSTGRES_PASSWORD}@postgres:5432/hems}
      - GPU_TYPE=${GPU_TYPE:-none}
      - GPU_HIGH_LOAD_THRESHOLD=${GPU_HIGH_LOAD_THRESHOLD:-80}
      - CHARACTER=${CHARACTER:-}
      - CHARACTER_FILE=${CHARACTER_FILE:-}
      - TZ=${TZ:-Asia/Tokyo}
      - OPENCLAW_BRIDGE_URL=${OPENCLAW_BRIDGE_URL:-}
      - LOCALCRAW_BRIDGE_URL=${LOCALCRAW_BRIDGE_URL:-}
      - OBSIDIAN_BRIDGE_URL=${OBSIDIAN_BRIDGE_URL:-}
      - GAS_BRIDGE_URL=${GAS_BRIDGE_URL:-}
      - HA_BRIDGE_URL=${HA_BRIDGE_URL:-}
      - BIOMETRIC_BRIDGE_URL=${BIOMETRIC_BRIDGE_URL:-}
      - PERCEPTION_BRIDGE_URL=${PERCEPTION_BRIDGE_URL:-}
      - SWITCHBOT_BRIDGE_URL=${SWITCHBOT_BRIDGE_URL:-}
      - NEWS_BRIDGE_URL=${NEWS_BRIDGE_URL:-}
      - KNOWLEDGE_BRIDGE_URL=${KNOWLEDGE_BRIDGE_URL:-}
      - TAPO_BRIDGE_URL=${TAPO_BRIDGE_URL:-}
      - AMBIENT_SPEAK_ENABLED=${AMBIENT_SPEAK_ENABLED:-true}
      - AMBIENT_SPEAK_INTERVAL=${AMBIENT_SPEAK_INTERVAL:-300}
      - EVENT_AUTOMATIONS=${EVENT_AUTOMATIONS:-}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-}
      - BOOT_LOAD_ENABLED=${BOOT_LOAD_ENABLED:-true}
      - BOOT_LOAD_WINDOW_SEC=${BOOT_LOAD_WINDOW_SEC:-2700}
      - BOOT_LOAD_MODEL=${BOOT_LOAD_MODEL:-}
      - BOOT_LOAD_API_URL=${BOOT_LOAD_API_URL:-}
      - BOOT_LOAD_PROVIDER=${BOOT_LOAD_PROVIDER:-}
      - FALLBACK_WAKE_TIME=${FALLBACK_WAKE_TIME:-07:00}
      - SUNRISE_ALARM_DEVICE=${SUNRISE_ALARM_DEVICE:-}
      - SUNRISE_ALARM_START_SEC=${SUNRISE_ALARM_START_SEC:-7200}
      - SUNRISE_ALARM_END_SEC=${SUNRISE_ALARM_END_SEC:-1800}
      - HEMS_GMAIL_VIP_SENDERS=${HEMS_GMAIL_VIP_SENDERS:-}
      - HEMS_GITHUB_VIP_REPOS=${HEMS_GITHUB_VIP_REPOS:-}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - BACKEND_API_KEY=${BACKEND_API_KEY:-}
    volumes:
      - ../services/brain/src:/app
      - ../config:/config:ro
      - hems_brain_data:/app/data
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-socket-mqtt
    <<: *limits-brain

  # --- Backend (API + DataMart) ---
  backend:
    build: ../services/backend
    container_name: hems-backend
    restart: always
    ports:
      - "${HEMS_PORT_BACKEND:-8010}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://hems:${POSTGRES_PASSWORD}@postgres:5432/hems}
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-backend
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - TZ=${TZ:-Asia/Tokyo}
      - HA_BRIDGE_URL=${HA_BRIDGE_URL:-}
      - CHARACTER=${CHARACTER:-}
      - CHARACTER_FILE=${CHARACTER_FILE:-}
      - BRAIN_CHAT_URL=${BRAIN_CHAT_URL:-http://brain:8080}
      - VOICE_SERVICE_URL=${VOICE_SERVICE_URL:-http://voice-service:8000}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - BACKEND_API_KEY=${BACKEND_API_KEY:-}
    volumes:
      - ../services/backend:/app
      - ../config:/config:ro
      - hems_backend_data:/app/data
      - hems_audio_data:/app/audio
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-docs
    <<: *limits-backend

  # --- Frontend (React SPA + nginx) ---
  frontend:
    build: ../services/frontend
    container_name: hems-frontend
    restart: always
    ports:
      - "${HEMS_PORT_FRONTEND:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      # nginx envsubst injects this into the /api/ proxy Authorization header
      # so the dashboard reaches the backend when BACKEND_API_KEY is enforced.
      - BACKEND_API_KEY=${BACKEND_API_KEY:-}
    networks:
      - hems-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Voice Service (Plugin-based TTS) ---
  voice-service:
    build: ../services/voice
    container_name: hems-voice
    restart: always
    ports:
      - "127.0.0.1:${HEMS_PORT_VOICE:-8012}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TTS_PROVIDER=${TTS_PROVIDER:-espeak}
      - TTS_FALLBACK=${TTS_FALLBACK:-}
      - VOICEVOX_URL=${VOICEVOX_URL:-http://voicevox:50021}
      - VOISONA_URL=${VOISONA_URL:-http://192.168.1.173:32766}
      - VOISONA_USERNAME=${VOISONA_USERNAME:-}
      - VOISONA_PASSWORD=${VOISONA_PASSWORD:-}
      - VOISONA_VOICE_NAME=${VOISONA_VOICE_NAME:-nurse-robot-type-t_ja_JP}
      - VOISONA_LANGUAGE=${VOISONA_LANGUAGE:-ja_JP}
      - STYLE_BERT_VITS2_URL=${STYLE_BERT_VITS2_URL:-}
      - LLM_API_URL=${LLM_API_URL:-http://ollama:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-oss:20b}
      - CHARACTER=${CHARACTER:-}
      - CHARACTER_FILE=${CHARACTER_FILE:-}
      - TZ=${TZ:-Asia/Tokyo}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
    volumes:
      - ../services/voice/src:/app
      - ../config:/config:ro
      - hems_audio_data:/app/audio
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-docs

  # --- Mock LLM (Development, profile: mock) ---
  mock-llm:
    build: ./mock_llm
    container_name: hems-mock-llm
    restart: unless-stopped
    profiles: ["mock"]
    ports:
      - "127.0.0.1:${HEMS_PORT_MOCK_LLM:-8011}:8000"
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-docs
      start_period: 10s

  # ========== Optional Services (profiles) ==========

  # --- OpenClaw Bridge (PC metrics + service monitor; built from legacy localcraw repo) ---
  localcraw-bridge:
    build:
      context: ../../localcraw
      dockerfile: Dockerfile
    container_name: hems-openclaw-bridge
    restart: always
    profiles: ["openclaw", "localcraw"]
    # pid:host でホストのPID名前空間を共有。
    # /proc はpid:host時にコンテナ内で自動的にホストのものが見えるため明示的なマウント不要。
    # (/proc:ro マウントは AppArmor + healthcheck exec と競合するため使用しない)
    pid: "host"
    ports:
      - "127.0.0.1:${HEMS_PORT_OPENCLAW_BRIDGE:-8013}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8000
      - TZ=${TZ:-Asia/Tokyo}
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-openclaw
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - OPENCLAW_METRICS_INTERVAL=${OPENCLAW_METRICS_INTERVAL:-10}
      - OPENCLAW_PROCESS_INTERVAL=${OPENCLAW_PROCESS_INTERVAL:-30}
      - HEMS_GMAIL_ENABLED=${HEMS_GMAIL_ENABLED:-false}
      - HEMS_GMAIL_EMAIL=${HEMS_GMAIL_EMAIL:-}
      - HEMS_GMAIL_APP_PASSWORD=${HEMS_GMAIL_APP_PASSWORD:-}
      - HEMS_GMAIL_INTERVAL=${HEMS_GMAIL_INTERVAL:-300}
      - HEMS_GITHUB_ENABLED=${HEMS_GITHUB_ENABLED:-false}
      - HEMS_GITHUB_TOKEN=${HEMS_GITHUB_TOKEN:-}
      - HEMS_GITHUB_INTERVAL=${HEMS_GITHUB_INTERVAL:-300}
      - HEMS_BROWSER_CHECKERS=${HEMS_BROWSER_CHECKERS:-[]}
      - HEMS_HA_URL=${HEMS_HA_URL:-}
      - HEMS_HA_TOKEN=${HEMS_HA_TOKEN:-}
    networks:
      hems-net:
        aliases:
          - openclaw-bridge
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    <<: *limits-bridge

  # --- Obsidian Bridge (Knowledge store integration) ---
  obsidian-bridge:
    build: ../services/obsidian-bridge
    container_name: hems-obsidian-bridge
    restart: always
    profiles: ["obsidian"]
    ports:
      - "127.0.0.1:${HEMS_PORT_OBSIDIAN_BRIDGE:-8014}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
      - OBSIDIAN_WATCHER_DEBOUNCE=${OBSIDIAN_WATCHER_DEBOUNCE:-2.0}
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-obsidian
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/obsidian-bridge/src:/app
      - ${OBSIDIAN_VAULT_PATH:-/tmp/hems-vault}:/vault
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
    <<: *limits-bridge

  # --- GAS Bridge (Google Apps Script integration) ---
  gas-bridge:
    build: ../services/gas-bridge
    container_name: hems-gas-bridge
    restart: always
    profiles: ["gas"]
    ports:
      - "127.0.0.1:${HEMS_PORT_GAS_BRIDGE:-8015}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - GAS_WEBAPP_URL=${GAS_WEBAPP_URL:-}
      - GAS_API_KEY=${GAS_API_KEY:-}
      - HEMS_GAS_CALENDAR_INTERVAL=${HEMS_GAS_CALENDAR_INTERVAL:-120}
      - HEMS_GAS_TASKS_INTERVAL=${HEMS_GAS_TASKS_INTERVAL:-300}
      - HEMS_GAS_GMAIL_INTERVAL=${HEMS_GAS_GMAIL_INTERVAL:-300}
      - HEMS_GAS_SHEETS_INTERVAL=${HEMS_GAS_SHEETS_INTERVAL:-600}
      - HEMS_GAS_DRIVE_INTERVAL=${HEMS_GAS_DRIVE_INTERVAL:-600}
      - HEMS_GAS_SHEETS=${HEMS_GAS_SHEETS:-}
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-gas
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/gas-bridge/src:/app
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
    <<: *limits-bridge

  # --- Home Assistant (Smart home hub) ---
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: hems-homeassistant
    profiles: ["ha"]
    volumes:
      - ${HEMS_HA_CONFIG_PATH:-./ha-config}:/config
      - /run/dbus:/run/dbus:ro
    network_mode: host
    privileged: true
    restart: unless-stopped
    healthcheck:
      # network_mode:host — HA HTTP API port 8123 を TCP で確認
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8123' 2>/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- Matter Server (Matter fabric for HA) ---
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: hems-matter-server
    profiles: ["ha"]
    volumes:
      - ${HEMS_MATTER_DATA_PATH:-./matter-data}:/data
      - /run/dbus:/run/dbus:ro
    network_mode: host
    privileged: true
    restart: unless-stopped
    command: --storage-path /data --port 5580
    healthcheck:
      # network_mode:host — Matter WebSocket port 5580 を TCP で確認
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5580' 2>/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- HA Bridge (Home Assistant integration) ---
  ha-bridge:
    build: ../services/ha-bridge
    container_name: hems-ha-bridge
    restart: always
    profiles: ["ha"]
    ports:
      - "127.0.0.1:${HEMS_PORT_HA_BRIDGE:-8016}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - HA_URL=${HA_URL:-http://host.docker.internal:8123}
      - HA_TOKEN=${HA_TOKEN:-}
      - HEMS_HA_ENTITY_MAP=${HEMS_HA_ENTITY_MAP:-{}}
      - HEMS_HA_POLL_INTERVAL=${HEMS_HA_POLL_INTERVAL:-30}
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-ha
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/ha-bridge/src:/app
    networks:
      - hems-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *healthcheck-http-health
    <<: *limits-bridge

  # --- Biometric Bridge (Smartband / Gadgetbridge integration) ---
  biometric-bridge:
    build: ../services/biometric-bridge
    container_name: hems-biometric-bridge
    restart: always
    profiles: ["biometric"]
    ports:
      - "127.0.0.1:${HEMS_PORT_BIOMETRIC_BRIDGE:-8017}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-biometric
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - BIOMETRIC_WEBHOOK_SECRET=${BIOMETRIC_WEBHOOK_SECRET:-}
      - BIOMETRIC_PROVIDER=${BIOMETRIC_PROVIDER:-gadgetbridge}
      - BIOMETRIC_DB_PATH=/data/send_queue.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/biometric-bridge/src:/app
      - hems_biometric_data:/data
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
    <<: *limits-bridge

  # --- VOICEVOX Engine ---
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    container_name: hems-voicevox
    restart: always
    profiles: ["voicevox"]
    ports:
      - "127.0.0.1:${HEMS_PORT_VOICEVOX:-50031}:50021"
    networks:
      - hems-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/50021' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # --- Ollama (Local LLM) ---
  # GPU-agnostic base. Run `python infra/scripts/gpu_setup.py` to generate
  # docker-compose.gpu.yml with NVIDIA/AMD-specific settings, then start with:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ollama up -d
  ollama:
    image: ollama/ollama
    container_name: hems-ollama
    restart: always
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:${HEMS_PORT_OLLAMA:-11444}:11434"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=${HSA_OVERRIDE_GFX_VERSION:-}
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - hems-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    <<: *limits-ollama

  # Pulls LLM_MODEL on startup (one-shot). Re-run after changing LLM_MODEL.
  # VRAM-based model selection: run `python infra/scripts/gpu_setup.py --auto-select`
  #   Default: ArliAI Qwen-3.5-27B-Derestricted (via mradermacher GGUF)
  #   Usable VRAM ≈ total − ~2GiB; a model must be ≲ usable to fully GPU-offload.
  #   Tiers: ~4GB→qwen2.5:3b  ~16GB→qwen3.5:9b-q8_0 (dense, 100% GPU — measured;
  #   a 27B ~15-17GB does NOT load on 16GB)  ~20GB→Derestricted:Q4_K_M
  #   ~22GB→:Q6_K  ~26GB→:Q8_0  ~85GB+→qwen3.5:122b-a10b
  ollama-pull:
    image: ollama/ollama
    container_name: hems-ollama-pull
    restart: "no"
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-gpt-oss:20b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${LLM_MODEL}"]
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - hems-net

  # --- PostgreSQL (core database since W4.5') ---
  postgres:
    image: postgres:16-alpine
    container_name: hems-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hems}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=hems
    ports:
      - "127.0.0.1:${HEMS_PORT_POSTGRES:-5442}:5432"
    volumes:
      - hems_pg_data:/var/lib/postgresql/data
    networks:
      - hems-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hems} -d hems"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Perception (Camera-based person detection + activity tracking) ---
  perception:
    build: ../services/perception
    container_name: hems-perception
    restart: always
    profiles: ["perception"]
    ports:
      - "127.0.0.1:${HEMS_PORT_PERCEPTION:-8018}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-perception
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_PERCEPTION_CAMERAS=${HEMS_PERCEPTION_CAMERAS:-[]}
      - HEMS_PERCEPTION_MODEL=${HEMS_PERCEPTION_MODEL:-yolo11s.pt}
      - HEMS_PERCEPTION_POSE_MODEL=${HEMS_PERCEPTION_POSE_MODEL:-yolo11s-pose.pt}
      - HEMS_PERCEPTION_CONFIDENCE=${HEMS_PERCEPTION_CONFIDENCE:-0.5}
      - HEMS_PERCEPTION_INTERVAL=${HEMS_PERCEPTION_INTERVAL:-5}
      - VLM_ENABLED=${VLM_ENABLED:-false}
      - VLM_OLLAMA_URL=${VLM_OLLAMA_URL:-http://ollama:11434}
      - VLM_LIGHT_MODEL=${VLM_LIGHT_MODEL:-moondream}
      - VLM_HEAVY_MODEL=${VLM_HEAVY_MODEL:-minicpm-v}
      - VLM_BASE_INTERVAL=${VLM_BASE_INTERVAL:-1800}
      - VLM_MIN_INTERVAL=${VLM_MIN_INTERVAL:-60}
      - VLM_MAX_INTERVAL=${VLM_MAX_INTERVAL:-7200}
      - VLM_BOOST_DURATION=${VLM_BOOST_DURATION:-300}
      - VLM_TIMEOUT=${VLM_TIMEOUT:-30}
      - VLM_MAX_TOKENS=${VLM_MAX_TOKENS:-256}
      - LLM_MODEL=${LLM_MODEL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/perception/src:/app
      - hems_perception_models:/root/.cache
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
      start_period: 30s
    <<: *limits-perception

  # --- SwitchBot Bridge (Direct SwitchBot API v1.1 integration) ---
  switchbot-bridge:
    build: ../services/switchbot-bridge
    container_name: hems-switchbot-bridge
    restart: always
    profiles: ["switchbot"]
    ports:
      - "127.0.0.1:${HEMS_PORT_SWITCHBOT_BRIDGE:-8019}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - SWITCHBOT_TOKEN=${SWITCHBOT_TOKEN:-}
      - SWITCHBOT_SECRET=${SWITCHBOT_SECRET:-}
      - SWITCHBOT_DEVICE_MAP=${SWITCHBOT_DEVICE_MAP:-{}}
      - SWITCHBOT_POLL_INTERVAL=${SWITCHBOT_POLL_INTERVAL:-30}
      - SWITCHBOT_WEBHOOK_URL=${SWITCHBOT_WEBHOOK_URL:-}
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-switchbot
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/switchbot-bridge/src:/app
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
    <<: *limits-bridge

  # --- Tapo Bridge (python-kasa direct LAN integration) ---
  tapo-bridge:
    build: ../services/tapo-bridge
    container_name: hems-tapo-bridge
    restart: always
    profiles: ["tapo"]
    ports:
      - "127.0.0.1:${HEMS_PORT_TAPO_BRIDGE:-8020}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - TAPO_USERNAME=${TAPO_USERNAME:-}
      - TAPO_PASSWORD=${TAPO_PASSWORD:-}
      - TAPO_DEVICES=${TAPO_DEVICES:-{}}
      - TAPO_ZONES=${TAPO_ZONES:-{}}
      - TAPO_NAMES=${TAPO_NAMES:-{}}
      - TAPO_POLL_INTERVAL=${TAPO_POLL_INTERVAL:-30}
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-tapo
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/tapo-bridge/src:/app
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
    <<: *limits-bridge

  # --- Zigbee2MQTT (official image, needs USB coordinator stick) ---
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: hems-zigbee2mqtt
    restart: unless-stopped
    profiles: ["zigbee"]
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      # Admin UI fallback — also reachable via nginx at http://<frontend>/z2m/
      - "127.0.0.1:${HEMS_PORT_Z2M_UI:-8090}:8080"
    volumes:
      - ../config/zigbee2mqtt:/app/data
      - ./zigbee2mqtt/entrypoint.sh:/usr/local/bin/hems-z2m-entrypoint.sh:ro
      - /run/udev:/run/udev:ro
    devices:
      - ${HEMS_Z2M_USB_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    # Custom entrypoint applies a tiny patch to herdsman to bypass the strict
    # preconfigured-key consistency check (see ./zigbee2mqtt/entrypoint.sh).
    entrypoint: ["/usr/local/bin/hems-z2m-entrypoint.sh"]
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - ZIGBEE2MQTT_CONFIG_MQTT_USER=hems-zigbee
      - ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD=${MQTT_PASS:?Set MQTT_PASS in .env}
    networks:
      - hems-net
    healthcheck:
      # z2m Admin UI が応答するまでの間、ポート到達確認で代用
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Weather Bridge (JMA / OpenWeatherMap → MQTT, always-on) ---
  weather-bridge:
    build: ../services/weather-bridge
    container_name: hems-weather-bridge
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=hems-weather
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - WEATHER_PROVIDER=${WEATHER_PROVIDER:-jma}
      - JMA_AREA_CODE=${JMA_AREA_CODE:-130000}
      - JMA_DETAIL_CODE=${JMA_DETAIL_CODE:-130010}
      - OWM_API_KEY=${OWM_API_KEY:-}
      - OWM_LAT=${OWM_LAT:-35.6762}
      - OWM_LON=${OWM_LON:-139.6503}
      - OWM_UNITS=${OWM_UNITS:-metric}
      - OWM_LANG=${OWM_LANG:-ja}
      - HEMS_WEATHER_CURRENT_INTERVAL=${HEMS_WEATHER_CURRENT_INTERVAL:-600}
      - HEMS_WEATHER_FORECAST_INTERVAL=${HEMS_WEATHER_FORECAST_INTERVAL:-1800}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/weather-bridge/src:/app
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
      start_period: 15s
    <<: *limits-bridge

  # --- News Bridge (RSS + Ollama summarizer) ---
  news-bridge:
    build: ../services/news-bridge
    container_name: hems-news-bridge
    restart: always
    profiles: ["news"]
    ports:
      - "127.0.0.1:${HEMS_PORT_NEWS_BRIDGE:-8021}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-news
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5}
      - OLLAMA_SUMMARY_MODEL=${OLLAMA_SUMMARY_MODEL:-}
      - NEWS_SOURCES=${NEWS_SOURCES:-nhk_main,nhk_international,bbc_world,guardian_world}
      - NEWS_DAILY_HOUR=${NEWS_DAILY_HOUR:-7}
      - NEWS_DAILY_MINUTE=${NEWS_DAILY_MINUTE:-30}
      - NEWS_POLL_INTERVAL=${NEWS_POLL_INTERVAL:-300}
      - NEWS_URGENCY_THRESHOLD=${NEWS_URGENCY_THRESHOLD:-0.8}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/news-bridge/src:/app
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
    <<: *limits-bridge

  # --- Knowledge Bridge (Multi-format document ingestion, read-only) ---
  knowledge-bridge:
    build: ../services/knowledge-bridge
    container_name: hems-knowledge-bridge
    restart: always
    profiles: ["knowledge"]
    ports:
      - "127.0.0.1:${HEMS_PORT_KNOWLEDGE_BRIDGE:-8022}:8000"
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - KNOWLEDGE_SOURCES=${KNOWLEDGE_SOURCES:-[]}
      - KNOWLEDGE_WATCHER_DEBOUNCE=${KNOWLEDGE_WATCHER_DEBOUNCE:-3.0}
      - KNOWLEDGE_MAX_SEARCH_RESULTS=${KNOWLEDGE_MAX_SEARCH_RESULTS:-20}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_CACHE_DIR=/app/data/embeddings
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - RRF_K=${RRF_K:-60}
      - MQTT_BROKER=mosquitto
      - MQTT_USER=hems-knowledge
      - MQTT_PASS=${MQTT_PASS:?Set MQTT_PASS in .env}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ../services/knowledge-bridge/src:/app
      - ${KNOWLEDGE_SOURCE_PWS:-/tmp/hems-knowledge-pws}:/sources/pws:ro
      - hems_knowledge_data:/app/data
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
      start_period: 15s
    <<: *limits-bridge

  # --- STT Service (Plugin-based Speech-to-Text) ---
  stt-service:
    build: ../services/stt
    container_name: hems-stt
    restart: always
    profiles: ["stt"]
    ports:
      - "127.0.0.1:${HEMS_PORT_STT:-8023}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - STT_PROVIDER=${STT_PROVIDER:-whisper}
      - STT_MODEL=${STT_MODEL:-large-v3-turbo}
      - STT_LANGUAGE=${STT_LANGUAGE:-ja}
      - STT_DEVICE=${STT_DEVICE:-auto}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-auto}
      - STT_BEAM_SIZE=${STT_BEAM_SIZE:-5}
      - STT_MAX_AUDIO_SECONDS=${STT_MAX_AUDIO_SECONDS:-60}
      - STT_LLM_REWRITE=${STT_LLM_REWRITE:-false}
      - STT_LLM_MODEL=${STT_LLM_MODEL:-}
      - LLM_API_URL=${LLM_API_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Asia/Tokyo}
      - HEMS_INTERNAL_TOKEN=${HEMS_INTERNAL_TOKEN:-}
    volumes:
      - ../services/stt/src:/app
      - hems_stt_models:/app/models
    networks:
      - hems-net
    healthcheck:
      <<: *healthcheck-http-health
      start_period: 90s
    <<: *limits-stt

volumes:
  hems_mqtt_data:
  hems_mqtt_log:
  hems_backend_data:
  hems_brain_data:
  hems_audio_data:
  hems_pg_data:
  hems_knowledge_data:
  hems_biometric_data:
  ollama_models:
  hems_perception_models:
  hems_stt_models:

networks:
  hems-net:
    name: hems-net
    driver: bridge
